<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f6feb" />
    <title>Offline – Einkaufszettel</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f8;
        --fg: #16181d;
        --muted: #5b6270;
        --card: #ffffff;
        --border: #d7dae0;
        --primary: #1f6feb;
        --primary-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101216;
          --fg: #eef1f5;
          --muted: #9aa3b2;
          --card: #171a20;
          --border: #2b303a;
          --primary: #4c8dff;
          --primary-fg: #0b1020;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        width: min(32rem, 100%);
        padding: 2rem;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
        box-shadow: 0 8px 30px rgb(0 0 0 / 0.08);
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      p {
        color: var(--muted);
      }
      button {
        min-height: 44px;
        padding: 0.75rem 1.25rem;
        border: 1px solid var(--primary);
        border-radius: 10px;
        background: var(--primary);
        color: var(--primary-fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      a {
        display: inline-block;
        margin-left: 0.75rem;
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Keine Verbindung</h1>
      <p>
        Diese Seite ist gerade nicht offline verfügbar. Sobald du wieder Netz hast, kannst du
        weiter einkaufen.
      </p>
      <p>Prüfe deine Verbindung und versuche es erneut.</p>
      <div>
        <button type="button" onclick="window.location.reload()">Erneut versuchen</button>
        <a href="/">Zur Startseite</a>
      </div>
    </main>
  </body>
</html>
