name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Statische Pruefung der Security-Baseline (Caddyfile/Dockerfile).
      # Kein Docker/caddy-Binary noetig; Exitcode 1 bei Abweichungen.
      - name: Security config
        run: node scripts/check-security-config.mjs

      - name: Test
        run: pnpm test

      # Build ist derzeit ein No-op, solange apps/web und packages/core noch
      # keinen Build-Script haben (Phase 1). Sobald Builds existieren, laeuft
      # dieser Schritt automatisch mit; fehlende Builds werden sauber geskippt.
      - name: Build
        run: pnpm build
