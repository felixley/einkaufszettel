name: E2E

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: 'Playwright (Chromium + WebKit-Mobile, alle Projekte)'
    runs-on: ubuntu-latest
    # Vier Projekte (chromium, mobile-chromium, webkit, mobile-webkit) und
    # CI-Retries: 15 Minuten waren fuer zwei Projekte knapp, 25 gibt Luft.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # T5.1: beide Engines installieren — Chromium (Desktop + Pixel 7) und
      # WebKit (Desktop Safari + iPhone 14). `--with-deps` zieht die noetigen
      # Systembibliotheken auf dem Ubuntu-Runner nach.
      - name: Install Playwright browsers (Chromium + WebKit)
        run: pnpm --filter @einkaufszettel/web exec playwright install --with-deps chromium webkit

      # Laeuft ohne Netz und ohne Secrets: die App nutzt im Test den
      # Mock-Auth-Adapter (NEXT_PUBLIC_AUTH_MOCK=true, siehe playwright.config.ts).
      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
