name: einkaufszettel

# Logrotation: fuer jeden Dienst begrenzt `json-file` die Loggroesse auf
# 10 MB pro Datei und haelt 3 Dateien vor (max. ~30 MB je Dienst). Das
# verhindert das Volllaufen der Docker-Logs auf dem Heimserver.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: supabase/postgres:15.19.0.007
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
      # Seed alphabetisch nach den Migrationen (zz_ sortiert hinter 2026...).
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/zz_seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d $${POSTGRES_DB:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: https://${DOMAIN:-localhost}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: https://${DOMAIN:-localhost}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32-chars-min}
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9999/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  rest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32-chars-min}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: https://${DOMAIN:-localhost}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:-dev-anon-key}
    depends_on:
      auth:
        condition: service_started
      rest:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend
      - edge

  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '${HTTPS_PORT:-443}:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      IPV64_API_KEY: ${IPV64_API_KEY:-}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'caddy', 'validate', '--config', '/etc/caddy/Caddyfile']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - edge

  # Optionales Monitoring — NICHT Teil des Kern-Stacks (Profil "monitoring"),
  # damit der normale Start unbeeinflusst bleibt. Start:
  #   docker compose --profile monitoring up -d uptime-kuma
  # Siehe docs/OPERATIONS.md (Abschnitt Monitoring) fuer Checks und Alarmweg.
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.7
    restart: unless-stopped
    logging: *default-logging
    profiles: ['monitoring']
    ports:
      - '${UPTIME_KUMA_PORT:-3001}:3001'
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - edge

volumes:
  db-data:
  caddy-data:
  caddy-config:
  uptime-kuma-data:

networks:
  backend:
    internal: true
  edge:
